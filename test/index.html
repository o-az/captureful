<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>Captureful harness</title>
    <style>
      body {
        margin: 0;
        font:
          15px/1.4 system-ui,
          -apple-system,
          sans-serif;
        background: #f4f4f5;
      }
      nav {
        padding: 8px;
        display: flex;
        flex-wrap: wrap;
        gap: 6px;
      }
      nav a {
        padding: 4px 8px;
        background: #e4e4e7;
        border-radius: 4px;
        color: #111;
        text-decoration: none;
      }
      .app {
        display: flex;
        height: calc(100vh - 140px);
        margin: 0 8px;
        border: 1px solid #d4d4d8;
        background: #fff;
      }
      .sidebar {
        width: 30%;
        border-right: 1px solid #ddd;
        padding: 8px;
        overflow: hidden;
      }
      .main {
        flex: 1;
        display: flex;
        flex-direction: column;
        min-width: 0;
      }
      .header,
      .composer {
        padding: 10px;
        background: #fafafa;
        border-bottom: 1px solid #eee;
      }
      .composer {
        border-top: 1px solid #eee;
        border-bottom: 0;
      }
      .scroller {
        flex: 1;
        overflow-y: auto;
        padding: 8px 12px;
        background: #fff;
      }
      .message {
        max-width: 75%;
        margin: 6px 0;
        padding: 8px 10px;
        border-radius: 12px;
        background: #e5e7eb;
      }
      .message.me {
        margin-left: auto;
        background: #3b82f6;
        color: #fff;
      }
      .message img {
        display: block;
        width: 100%;
        border-radius: 8px;
        margin-top: 6px;
      }
      .day {
        position: sticky;
        top: 0;
        text-align: center;
        font-size: 12px;
        color: #666;
        background: rgba(255, 255, 255, 0.9);
        padding: 2px;
      }
      .virtual-list {
        position: relative;
      }
      .virtual-row {
        position: absolute;
        left: 0;
        right: 0;
        height: 56px;
        display: flex;
        align-items: center;
        padding: 0 12px;
        border-bottom: 1px solid #eee;
      }
      .reverse {
        display: flex;
        flex-direction: column-reverse;
      }
      .modal-backdrop {
        position: fixed;
        inset: 0;
        background: rgba(0, 0, 0, 0.4);
        display: flex;
        align-items: center;
        justify-content: center;
      }
      .modal {
        width: min(480px, 92vw);
        height: 70vh;
        background: #fff;
        border-radius: 8px;
        overflow-y: auto;
        padding: 16px;
      }
      .page p {
        margin: 0 12px 12px;
        padding: 12px;
        background: #fff;
        border: 1px solid #e5e5e5;
      }
      .page header {
        position: fixed;
        top: 0;
        left: 0;
        right: 0;
        background: #111;
        color: #fff;
        padding: 10px;
        z-index: 10;
      }
    </style>
  </head>
  <body>
    <nav>
      <a href="?scenario=chat">chat</a><a href="?scenario=lazy">lazy (X-like)</a
      ><a href="?scenario=virtual">virtual</a> <a href="?scenario=reverse">column-reverse</a
      ><a href="?scenario=modal">modal</a><a href="?scenario=page">page</a
      ><a href="?scenario=overlay">overlay</a><a href="shadow.html">shadow</a>
    </nav>
    <div id="root"></div>
    <script>
      const scenario = new URLSearchParams(location.search).get('scenario') || 'chat'
      const root = document.getElementById('root')
      /** @param {number} index */
      const hue = index => `hsl(${(index * 37) % 360} 70% 85%)`
      /** @param {number} index */
      const messageHtml = index =>
        `<div class="message ${index % 3 === 0 ? 'me' : ''}" data-index="${index}" style="${index % 3 ? `background:${hue(index)}` : ''}"><b>#${index}</b> ${'lorem ipsum dolor sit amet '.repeat(1 + (index % 4))}${index % 11 === 5 ? `<img src="img.svg?index=${index}" alt="">` : ''}</div>`
      /** @param {string} inner @param {string} [extra] */
      const shell = (inner, extra = '') =>
        `<div class="app"><div class="sidebar">Sidebar<br>${'item<br>'.repeat(30)}</div><div class="main"><div class="header">Chat header</div>${inner}<div class="composer">Composer</div></div></div>${extra}`
      if (scenario === 'chat') {
        let html = ''
        for (let index = 0; index < 120; index++) {
          if (index % 20 === 0) html += `<div class="day">Day ${index / 20 + 1}</div>`
          html += messageHtml(index)
        }
        root.innerHTML = shell(`<div class="scroller" id="target">${html}</div>`)
      } else if (scenario === 'lazy') {
        // Starts at the bottom; older messages are prepended when scrolled near the top, keeping the view stable.
        root.innerHTML = shell(`<div class="scroller" id="target"></div>`)
        const scroller = document.getElementById('target')
        let oldest = 200
        /** @param {number} count */
        const prepend = count => {
          const before = scroller.scrollHeight
          let html = ''
          for (let index = oldest - count; index < oldest; index++) html += messageHtml(index)
          oldest -= count
          scroller.insertAdjacentHTML('afterbegin', html)
          scroller.scrollTop += scroller.scrollHeight - before
        }
        prepend(25)
        scroller.scrollTop = scroller.scrollHeight
        let loading = false
        scroller.addEventListener('scroll', () => {
          if (loading || oldest <= 100 || scroller.scrollTop > 200) return
          loading = true
          setTimeout(() => {
            prepend(25)
            loading = false
          }, 300)
        })
      } else if (scenario === 'virtual') {
        const ROW_COUNT = 1000
        const ROW_HEIGHT = 56
        root.innerHTML = shell(
          `<div class="scroller" id="target" style="padding:0"><div class="virtual-list" style="height:${ROW_COUNT * ROW_HEIGHT}px"></div></div>`
        )
        const scroller = document.getElementById('target')
        const list = scroller.firstElementChild
        /** @type {Map<number, HTMLElement>} */
        const rows = new Map()
        const draw = () => {
          const from = Math.max(0, Math.floor(scroller.scrollTop / ROW_HEIGHT) - 3)
          const to = Math.min(
            ROW_COUNT,
            Math.ceil((scroller.scrollTop + scroller.clientHeight) / ROW_HEIGHT) + 3
          )
          for (const [index, row] of rows)
            if (index < from || index >= to) {
              row.remove()
              rows.delete(index)
            }
          for (let index = from; index < to; index++)
            if (!rows.has(index)) {
              const row = document.createElement('div')
              row.className = 'virtual-row'
              row.style.top = `${index * ROW_HEIGHT}px`
              row.style.background = hue(index)
              row.textContent = `Virtual row ${index}`
              list.append(row)
              rows.set(index, row)
            }
        }
        scroller.addEventListener('scroll', draw)
        draw()
      } else if (scenario === 'reverse') {
        let html = ''
        for (let index = 79; index >= 0; index--) html += messageHtml(index)
        root.innerHTML = shell(`<div class="scroller reverse" id="target">${html}</div>`)
      } else if (scenario === 'modal') {
        let html = '<h2>Modal</h2>'
        for (let index = 0; index < 60; index++)
          html += `<p style="background:${hue(index)};padding:8px">Modal paragraph ${index}</p>`
        root.innerHTML = shell(
          `<div class="scroller">background</div>`,
          `<div class="modal-backdrop"><div class="modal" id="target">${html}</div></div>`
        )
      } else if (scenario === 'overlay') {
        // Like X's chat: a transparent sibling layer sits on top of the scroller.
        let html = ''
        for (let index = 0; index < 80; index++) html += messageHtml(index)
        root.innerHTML = shell(
          `<div style="position:relative;flex:1;min-height:0;display:flex"><div class="scroller" id="target">${html}</div><div class="layer" style="position:absolute;inset:0"></div></div>`
        )
      } else if (scenario === 'page') {
        document.body.classList.add('page')
        let html = '<header>Fixed page header</header><div style="height:50px"></div>'
        for (let index = 0; index < 80; index++)
          html += `<p style="background:${hue(index)}">Page paragraph ${index}</p>`
        root.innerHTML = html
      }
    </script>
  </body>
</html>
