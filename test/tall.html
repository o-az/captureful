<!doctype html>
<meta
  name="viewport"
  content="width=device-width,initial-scale=1" />
<body style="margin: 0; font: 16px system-ui">
  <script>
    for (let index = 0; index < 120; index++)
      document.write(
        `<div style="height:40px;border-bottom:1px solid #ccc;background:hsl(${index * 7},70%,85%)">Row ${index}</div>`
      )
  </script>
</body>
